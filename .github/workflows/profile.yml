name: Profile animations

on:
  schedule:
    - cron: "0 8 * * *" # 03:00 in Colombia (UTC-5)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#f2dfa0&color_dots=#161b22,#3a3020,#6e5410,#b8912f,#d9b44a
            dist/snake-light.svg?color_snake=#6e5410&color_dots=#ebedf0,#f2dfa0,#d9b44a,#b8912f,#6e5410
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  skyline-and-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: .github/profile-3d-gold.json
      - name: Build the stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 .github/scripts/stats.py assets/stats-live.svg
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add profile-3d-contrib assets/stats-live.svg
          if git commit -m "Update profile animations"; then
            git push
          fi

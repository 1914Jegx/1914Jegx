<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 210" width="380" height="210" role="img" aria-label="Video ads">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c1810"/><stop offset="1" stop-color="#0d0d0f"/></linearGradient>
    <style>
      .t { font: 700 24px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f4f1ea; }
      .d { font: 400 16px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #c9c3b5; }
      .p { font: 700 15px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #0d0d0f; }
      .run { stroke-dasharray: 120 1080; animation: run 6s linear 0.6s infinite; }
      @keyframes run { to { stroke-dashoffset: -1200; } }
    </style>
  </defs>
  <g>
    <rect x="1" y="1" width="378" height="208" rx="18" fill="url(#g)"/>
    <rect x="1" y="1" width="378" height="208" rx="18" fill="none" stroke="#6e5410" stroke-width="1.2"/>
    <g fill="none" stroke="#d9b44a" stroke-width="2.2"><rect x="26" y="34" width="40" height="32" rx="7"/></g><path d="M41 42l12 8-12 8z" fill="#d9b44a"/>
    <text x="28" y="108" class="t">Video ads</text>
    <text x="28" y="140" class="d">Short AI video ads for Reels,</text>
    <text x="28" y="164" class="d">TikTok and Stories.</text>
    <rect x="248" y="34" width="106" height="30" rx="15" fill="#d9b44a"/>
    <text x="301" y="54" class="p" text-anchor="middle">from $20</text>
  </g>
  <rect x="1" y="1" width="378" height="208" rx="18" fill="none" stroke="#d9b44a" stroke-width="2" class="run"/>

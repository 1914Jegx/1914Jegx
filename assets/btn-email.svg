<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" width="220" height="64" role="img" aria-label="Email me">
  <defs><style>
    .b { font: 700 19px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f2dfa0; }
    .s { font: 500 12px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #f2dfa0; opacity: .8; }
    .shine { animation: sweep 3.5s ease-in-out infinite; }
    @keyframes sweep { 0% { transform: translateX(-120px); } 60%, 100% { transform: translateX(260px); } }
  </style>
  <clipPath id="r"><rect width="220" height="64" rx="32"/></clipPath></defs>
  <g clip-path="url(#r)">
    <rect width="220" height="64" fill="#1c1810"/>
    <rect x="0" y="-20" width="40" height="110" fill="#fff" opacity=".18" transform="skewX(-20)" class="shine"/>
  </g>
  <rect x=".75" y=".75" width="218.5" height="62.5" rx="31.25" fill="none" stroke="#d9b44a" stroke-width="1.5"/>
  <text x="110" y="31" text-anchor="middle" class="b">Email me</text>
  <text x="110" y="49" text-anchor="middle" class="s">1914jegx@gmail.com</text>
</svg>

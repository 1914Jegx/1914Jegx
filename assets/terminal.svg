<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" role="img" aria-label="whoami: Jhonatan González, AI-first product engineer in Colombia. Services: websites, AI assistants, video ads. Motto: Love never fails.">
  <defs><style>

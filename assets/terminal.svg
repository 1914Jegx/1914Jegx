    .out { font: 400 20px 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; fill: #f2dfa0; }
    .bar { font: 600 14px 'Segoe UI', Ubuntu, 'Helvetica Neue', Helvetica, Arial, sans-serif; fill: #c9c3b5; }
